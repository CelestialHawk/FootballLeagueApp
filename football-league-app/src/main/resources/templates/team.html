<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Team Matches</title>
</head>

<body>

    <div class="team-page">

        <h1>Last 10 Matches</h1>

        <table>
            <thead>
                <tr>
                    <th>Match</th>
                    <th>Score</th>
                    <th>Result</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="teammatch : ${matches}">

                    <td>
                        <span th:text="${teammatch.match.homeTeam.name}"></span>
                        <strong> vs </strong>
                        <span th:text="${teammatch.match.awayTeam.name}"></span>
                    </td>

                    <td>
                        <span th:text="${teammatch.match.homeScore}"></span>
                        -
                        <span th:text="${teammatch.match.awayScore}"></span>
                    </td>

                    <td
                        class="result"
                        th:classappend="${teammatch.result == 'WIN'} ? ' win' :
                                        (${teammatch.result == 'DRAW'} ? ' draw' : ' loss')"
                        th:text="${teammatch.result}">
                    </td>

                </tr>
            </tbody>
        </table>

        <a class="back-link" href="/league">
            ← Back to league table
        </a>

    </div>

</body>

</html>
